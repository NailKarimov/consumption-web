<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Consumption Web{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --bg-page: #f3f4f6;
            --bg-card: #ffffff;
            --border-card: #e5e7eb;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #111827;
            --text-muted: #6b7280;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --error-bg: #fee2e2;
            --error-text: #b91c1c;
            --danger-border: #fecaca;
            --table-header-bg: #f9fafb;
            --table-row-alt: #f9fafb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
        }

        .page {
            max-width: 1200px;
            margin: 24px auto 40px auto;
            padding: 0 16px;
        }

        .page-title {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 24px;
            font-weight: 600;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 6px;
            padding: 16px 20px 18px 20px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
            margin-bottom: 16px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
            margin: -8px -20px 12px -20px;
            padding: 8px 20px;
            background: #f9fafb;
            border-bottom: 1px solid var(--border-card);
        }

        .history-meta {
            font-weight: 400;
            font-size: 12px;
            color: var(--text-muted);
        }

        .upload-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: stretch;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 14px;
            border-radius: 4px;
            border: 1px solid transparent;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 1px 2px rgba(37, 99, 235, 0.45);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            box-shadow: 0 2px 5px rgba(37, 99, 235, 0.55);
        }

        .btn-secondary {
            background: #ffffff;
            border-color: #d1d5db;
            color: #111827;
        }

        .btn-secondary:hover {
            background: #f3f4f6;
        }

        .btn-danger {
            background: #ffffff;
            border-color: var(--danger-border);
            color: var(--error-text);
        }

        .btn-danger:hover {
            background: var(--error-bg);
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table.table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .table thead {
            background: var(--table-header-bg);
        }

        .table thead th {
            text-align: left;
            font-weight: 500;
            padding: 8px 10px;
            border-bottom: 1px solid #e5e7eb;
            color: #374151;
            white-space: nowrap;
        }

        .table tbody tr:nth-child(2n) {
            background: var(--table-row-alt);
        }

        .table tbody td {
            padding: 7px 10px;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: middle;
        }

        .cell-run a {
            color: var(--accent);
            text-decoration: none;
        }

        .cell-run a:hover {
            text-decoration: underline;
        }

        .cell-actions {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
        }

        .cell-generated,
        .cell-duration {
            white-space: nowrap;
        }

        .cell-uploaded {
            white-space: nowrap;
            color: var(--text-muted);
            font-size: 12px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
        }

        .badge-success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .badge-error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .file-input {
            position: relative;
            flex: 1 1 260px;
            border-radius: 6px;
            border: 1px dashed #d1d5db;
            background: #f9fafb;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.12s ease, background 0.12s ease;
        }

        .file-input:hover {
            border-color: var(--accent);
            background: #eef2ff;
        }

        .file-input input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-input-main {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .file-input-title {
            font-size: 13px;
            font-weight: 500;
        }

        .file-input-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .muted {
            color: var(--text-muted);
            font-size: 13px;
            margin: 4px 0 0;
        }

        /* Loading overlay */

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-box {
            background: #111827;
            color: #e5e7eb;
            padding: 18px 22px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 220px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 3px solid #4b5563;
            border-top-color: #facc15;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            font-size: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        body.loading .page {
            pointer-events: none;
            filter: blur(1px);
        }

        body.loading #loading-overlay {
            display: flex;
        }

        @media (max-width: 768px) {
            .page {
                margin-top: 16px;
            }

            .upload-row {
                flex-direction: column;
                align-items: stretch;
            }

            .cell-actions {
                justify-content: flex-start;
            }
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="page">
    {% block content %}{% endblock %}
</div>

<div id="loading-overlay" class="loading-overlay">
    <div class="loading-box">
        <div class="spinner"></div>
        <div class="loading-text">Processing file, please wait...</div>
    </div>
</div>
</body>
</html>
